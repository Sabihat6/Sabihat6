<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Adoption Timeframe Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agile Adoption Timeframe Calculator</h1>
        <p>Enter the number of members in your organization unit to get an approximate adoption timeframe for the Agile framework.</p>
        <label for="members">Number of Members:</label>
        <input type="number" id="members" min="1" placeholder="e.g., 10">
        <button id="calculate">Calculate Timeframe</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
